const ST=[["","Por contactar"],["enviado","Mensagem enviada"],["respondeu","Respondeu"],["conversa","Conversa marcada"],["parceiro","Parceiro ✓"],["nao","Sem interesse"]];
const state={};let filter="todos";let db=null;
const $=s=>document.querySelector(s);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function link(s){if(!s)return"";const h=s.startsWith("@")?"https://www.instagram.com/"+s.slice(1).split(" ")[0]+"/":(/^[\w.-]+\.\w{2,}/.test(s)?"https://"+s.split(" ")[0]:null);return h?`<a href="${h}" target="_blank" rel="noopener">${esc(s)}</a>`:esc(s)}
function filters(){const opts=[["todos","Todos"],["Quinta","Quintas"],["Wedding planner","Planners"],["p1","Prioridade 1"],["","Por contactar"],["enviado","Enviados"],["conversa","Conversas"]];
 $('#filters').innerHTML=opts.map(([k,l])=>`<button class="pill" data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join("")+`<span class="stat" id="stat"></span>`;
 document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()})}
function visible(l){const s=(state[l.id]||{}).s||"";if(filter==="todos")return true;if(filter==="Quinta"||filter==="Wedding planner")return l.tipo===filter;if(filter==="p1")return l.prio===1;return s===filter}
function render(){filters();const g=$('#grid');g.innerHTML="";
 const c={};LEADS.forEach(l=>{const s=(state[l.id]||{}).s||"";c[s]=(c[s]||0)+1});
 $('#stat').textContent=`${c.enviado||0} enviados · ${(c.respondeu||0)+(c.conversa||0)} em conversa · ${c.parceiro||0} parceiros`;
 LEADS.filter(visible).sort((a,b)=>a.prio-b.prio).forEach(l=>{const st=state[l.id]||{};const el=document.createElement('article');el.className="card";el.dataset.s=st.s||"";
  el.innerHTML=`<div class="top"><div><h2>${esc(l.nome)}</h2><small>${esc(l.tipo)} · ${esc(l.regiao)}</small></div><span class="tag">P${l.prio}</span></div>
  <div class="ct">${[l.ig&&link(l.ig),l.site&&link(l.site),esc(l.contacto)].filter(Boolean).join(" · ")}</div>
  <details><summary>Mensagem personalizada</summary><pre>${esc(l.msg)}</pre></details>
  <div class="row"><button class="copy">Copiar mensagem</button><select aria-label="Estado">${ST.map(([k,v])=>`<option value="${k}" ${k===(st.s||"")?"selected":""}>${v}</option>`).join("")}</select></div>
  <div class="row"><input placeholder="Nota (ex.: falar com a Carolina, ligar 5.ª)" value="${esc(st.n||"")}" aria-label="Nota"></div>`;
  el.querySelector('.copy').onclick=e=>{const b=e.target;try{navigator.clipboard.writeText(l.msg).then(()=>{b.textContent="Copiada";setTimeout(()=>b.textContent="Copiar mensagem",1500)},()=>{el.querySelector('details').open=true})}catch{el.querySelector('details').open=true}};
  el.querySelector('select').onchange=e=>save(l.id,{s:e.target.value,n:el.querySelector('input').value});
  let t;el.querySelector('input').oninput=e=>{clearTimeout(t);t=setTimeout(()=>save(l.id,{s:el.querySelector('select').value,n:e.target.value}),800)};
  g.appendChild(el)})}
const KEY="parcerias-estado-v1";
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{}}
function save(id,v){state[id]={...v,t:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(state));$('#sync').textContent="Guardado neste dispositivo."}catch{$('#sync').textContent="O navegador não deixou guardar. Usa \"Exportar cópia\" para não perderes o estado."}render()}
function exportar(){const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="parcerias-estado.json";a.click()}
function importar(f){const r=new FileReader();r.onload=()=>{try{Object.assign(state,JSON.parse(r.result));localStorage.setItem(KEY,JSON.stringify(state));$('#sync').textContent="Cópia importada.";render()}catch{$('#sync').textContent="Ficheiro inválido."}};r.readAsText(f)}
document.getElementById("exp").onclick=exportar;
document.getElementById("imp").onchange=e=>e.target.files[0]&&importar(e.target.files[0]);
load();render();$('#sync').textContent="O estado fica guardado neste navegador. Exporta uma cópia de vez em quando.";
</script>
